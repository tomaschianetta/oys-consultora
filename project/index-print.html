<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chianetta Consulting · Estudio Contable Internacional</title>
<meta name="description" content="Estudio contable boutique con sedes en Rosario y Sydney."/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="src/styles.css"/>

<style>
  /* Print-specific overrides */
  @page {
    size: A4 portrait;
    margin: 12mm 14mm;
  }
  html, body {
    background: #fff !important;
  }
  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Disable all motion/reveal animations in print so content is visible */
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
  }

  /* Make sticky header static */
  .site-header { position: static !important; backdrop-filter: none !important; }

  /* Hide interactive-only chrome */
  .wa-fab,
  .lang-switch,
  .header-actions .btn,
  .tweaks-panel,
  [class*="tweak"] { display: none !important; }

  /* Sections: avoid breaking inside cards, allow between sections */
  .section, .hero, .footer {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .section { padding: 32px 0 !important; }
  .hero { padding: 16px 0 32px !important; }

  /* Force page breaks before key sections */
  .services-ar,
  .services-int,
  .team,
  .offices,
  .faq,
  .contact {
    break-before: page;
    page-break-before: always;
  }

  /* Open all FAQ items by default in print */
  .faq-a-wrap { grid-template-rows: 1fr !important; }
  .faq-a { padding-bottom: 20px !important; }

  /* Service grid: 2 columns in print to fit */
  @media print {
    .services-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .steps { grid-template-columns: repeat(2, 1fr) !important; }
    .footer-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .hero-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .about-grid, .contact-grid, .stack-row { grid-template-columns: 1fr !important; gap: 24px !important; }
    .display { font-size: 48px !important; }
    .h-display { font-size: 32px !important; }
    .hero-stats { padding: 16px 0 !important; }
    .container { padding: 0 8px !important; }
  }

  /* Allow dark sections to keep their backgrounds */
  .services-int, .contact, .footer, .hero-card {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="src/translations.js"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/components.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel">
  // Wait for fonts + React render, then print.
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    // Poll for the app to render
    const start = Date.now();
    while (Date.now() - start < 8000) {
      if (document.querySelector('.footer')) break;
      await new Promise(r => setTimeout(r, 100));
    }
    // Open all FAQ items
    document.querySelectorAll('.faq-item').forEach(el => el.classList.add('is-open'));
    await new Promise(r => setTimeout(r, 700));
    window.print();
  })();
</script>
</body>
</html>
